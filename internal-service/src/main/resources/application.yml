spring:
  application:
    name: internal-service

  profiles:
    active: dev

  main:
    allow-circular-references: false

  mvc:
    problemdetails:
      enabled: true

  flyway:
    #enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: false

  jpa:
    entity-packages-to-scan: com.sparrowx.internal.data.postgres.entities
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        column_ordering_strategy: legacy
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        format_sql: false
    show-sql: false
  grpc:
    server:
      port: 50055
      ssl:
        enabled: false


internal:
  graph:
    neo4j:
      uri: ${INTSVC_NEO4J_URI:bolt://localhost:7687}
      username: ${INTSVC_NEO4J_USERNAME:neo4j}
      password: ${INTSVC_NEO4J_PASSWORD:password}
      database: ${INTSVC_NEO4J_DATABASE:neo4j}
      dev-insecure-auth: true

server:
  port: 8084

