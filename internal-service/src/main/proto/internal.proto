syntax = "proto3";

package sparrowx.internal.v1;

option java_multiple_files = true;
option java_package = "com.sparrowx.internal.grpc";
option java_outer_classname = "InternalServiceProto";

import "google/protobuf/timestamp.proto";

service InternalService {
  // ========================
  // Engineers / Learners
  // ========================

  rpc CreateEngineer(CreateEngineerRequest) returns (CreateEngineerResponse);
  rpc GetEngineer(GetEngineerRequest) returns (GetEngineerResponse);

  // ========================
  // Teams
  // ========================

  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);

  // ========================
  // Modules / Services
  // ========================

  rpc CreateModule(CreateModuleRequest) returns (CreateModuleResponse);
  rpc GetModule(GetModuleRequest) returns (GetModuleResponse);

  // ========================
  // Repositories
  // ========================

  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);

  // ========================
  // Internal Document References
  // ========================

  rpc CreateInternalDocument(CreateInternalDocumentRequest)
      returns (CreateInternalDocumentResponse);

  rpc GetInternalDocument(GetInternalDocumentRequest)
      returns (GetInternalDocumentResponse);

  // ========================
  // Runbooks
  // ========================

  rpc CreateRunbook(CreateRunbookRequest) returns (CreateRunbookResponse);
  rpc GetRunbook(GetRunbookRequest) returns (GetRunbookResponse);

  // ========================
  // Onboarding Paths
  // ========================

  rpc CreateOnboardingPath(CreateOnboardingPathRequest)
      returns (CreateOnboardingPathResponse);

  rpc GetOnboardingPath(GetOnboardingPathRequest)
      returns (GetOnboardingPathResponse);

  // ========================
  // Onboarding Tasks
  // ========================

  rpc CreateOnboardingTask(CreateOnboardingTaskRequest)
      returns (CreateOnboardingTaskResponse);

  rpc GetOnboardingTask(GetOnboardingTaskRequest)
      returns (GetOnboardingTaskResponse);

  // ========================
  // Engineer Onboarding
  // ========================

  rpc AssignEngineerToOnboardingPath(AssignEngineerToOnboardingPathRequest)
      returns (AssignEngineerToOnboardingPathResponse);

  rpc CompleteOnboardingTask(CompleteOnboardingTaskRequest)
      returns (CompleteOnboardingTaskResponse);

  rpc GetEngineerOnboardingProgress(GetEngineerOnboardingProgressRequest)
      returns (GetEngineerOnboardingProgressResponse);

  // ========================
  // Permissions
  // ========================

  rpc CreatePermission(CreatePermissionRequest)
      returns (CreatePermissionResponse);

  rpc GetPermission(GetPermissionRequest)
      returns (GetPermissionResponse);

  // ========================
  // Internal Entity Search
  // ========================

  rpc SearchInternalEntities(SearchInternalEntitiesRequest)
      returns (SearchInternalEntitiesResponse);

  // ========================
  // Read-Only Graph Context
  // ========================

  rpc ReadInternalCompanyGraph(ReadInternalCompanyGraphRequest)
      returns (ReadInternalCompanyGraphResponse);

  rpc ReadLearningGraph(ReadLearningGraphRequest)
      returns (ReadLearningGraphResponse);
}

// ========================
// Request Context
// ========================

message RequestContext {
  string tenant_id = 1;
  string actor_id = 2;
  string request_id = 3;
}

// ========================
// Enums
// ========================

enum EngineerRole {
  ENGINEER_ROLE_UNSPECIFIED = 0;
  ENGINEER_ROLE_INTERN = 1;
  ENGINEER_ROLE_JUNIOR_ENGINEER = 2;
  ENGINEER_ROLE_ENGINEER = 3;
  ENGINEER_ROLE_SENIOR_ENGINEER = 4;
  ENGINEER_ROLE_STAFF_ENGINEER = 5;
}

enum OnboardingAssignmentStatus {
  ONBOARDING_ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  ONBOARDING_ASSIGNMENT_STATUS_ASSIGNED = 1;
  ONBOARDING_ASSIGNMENT_STATUS_IN_PROGRESS = 2;
  ONBOARDING_ASSIGNMENT_STATUS_COMPLETED = 3;
  ONBOARDING_ASSIGNMENT_STATUS_CANCELLED = 4;
}

enum OnboardingTaskProgressStatus {
  ONBOARDING_TASK_PROGRESS_STATUS_UNSPECIFIED = 0;
  ONBOARDING_TASK_PROGRESS_STATUS_NOT_STARTED = 1;
  ONBOARDING_TASK_PROGRESS_STATUS_IN_PROGRESS = 2;
  ONBOARDING_TASK_PROGRESS_STATUS_COMPLETED = 3;
  ONBOARDING_TASK_PROGRESS_STATUS_SKIPPED = 4;
}

enum InternalGraphType {
  INTERNAL_GRAPH_TYPE_UNSPECIFIED = 0;
  INTERNAL_GRAPH_TYPE_COMPANY = 1;
  INTERNAL_GRAPH_TYPE_LEARNING = 2;
}

enum InternalGraphNodeType {
  INTERNAL_GRAPH_NODE_TYPE_UNSPECIFIED = 0;
  INTERNAL_GRAPH_NODE_TYPE_COMPANY = 1;
  INTERNAL_GRAPH_NODE_TYPE_ENGINEER = 2;
  INTERNAL_GRAPH_NODE_TYPE_TEAM = 3;
  INTERNAL_GRAPH_NODE_TYPE_MODULE = 4;
  INTERNAL_GRAPH_NODE_TYPE_REPOSITORY = 5;
  INTERNAL_GRAPH_NODE_TYPE_DOCUMENT = 6;
  INTERNAL_GRAPH_NODE_TYPE_RUNBOOK = 7;
  INTERNAL_GRAPH_NODE_TYPE_ONBOARDING_PATH = 8;
  INTERNAL_GRAPH_NODE_TYPE_ONBOARDING_TASK = 9;
  INTERNAL_GRAPH_NODE_TYPE_ONBOARDING_ASSIGNMENT = 10;
  INTERNAL_GRAPH_NODE_TYPE_PERMISSION = 11;
  INTERNAL_GRAPH_NODE_TYPE_LEARNING_TOPIC = 12;
  INTERNAL_GRAPH_NODE_TYPE_LEARNING_OBJECTIVE = 13;
}

enum InternalGraphRelationshipType {
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_UNSPECIFIED = 0;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_MEMBER_OF = 1;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_OWNS = 2;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_BELONGS_TO = 3;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_DOCUMENTS = 4;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_HAS_RUNBOOK = 5;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_HAS_TASK = 6;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_ASSIGNED_TO = 7;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_REQUIRES_PERMISSION = 8;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_DEPENDS_ON = 9;
  INTERNAL_GRAPH_RELATIONSHIP_TYPE_RELATED_TO = 10;
}

// ========================
// Engineer
// ========================

message CreateEngineerRequest {
  RequestContext context = 1;
  string full_name = 2;
  string email = 3;
  EngineerRole role = 4;
}

message CreateEngineerResponse {
  Engineer engineer = 1;
}

message GetEngineerRequest {
  RequestContext context = 1;
  string engineer_id = 2;
}

message GetEngineerResponse {
  Engineer engineer = 1;
}

message Engineer {
  string engineer_id = 1;
  string tenant_id = 2;
  string full_name = 3;
  string email = 4;
  EngineerRole role = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ========================
// Team
// ========================

message CreateTeamRequest {
  RequestContext context = 1;
  string name = 2;
  string description = 3;
}

message CreateTeamResponse {
  Team team = 1;
}

message GetTeamRequest {
  RequestContext context = 1;
  string team_id = 2;
}

message GetTeamResponse {
  Team team = 1;
}

message Team {
  string team_id = 1;
  string tenant_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ========================
// Module / Service
// ========================

message CreateModuleRequest {
  RequestContext context = 1;
  string name = 2;
  string description = 3;
  string owning_team_id = 4;
}

message CreateModuleResponse {
  Module module = 1;
}

message GetModuleRequest {
  RequestContext context = 1;
  string module_id = 2;
}

message GetModuleResponse {
  Module module = 1;
}

message Module {
  string module_id = 1;
  string tenant_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  string owning_team_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ========================
// Repository
// ========================

message CreateRepositoryRequest {
  RequestContext context = 1;
  string name = 2;
  string url = 3;
  string module_id = 4;
}

message CreateRepositoryResponse {
  Repository repository = 1;
}

message GetRepositoryRequest {
  RequestContext context = 1;
  string repository_id = 2;
}

message GetRepositoryResponse {
  Repository repository = 1;
}

message Repository {
  string repository_id = 1;
  string tenant_id = 2;
  string name = 3;
  string url = 4;
  string module_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ========================
// Internal Document Reference
// ========================

message CreateInternalDocumentRequest {
  RequestContext context = 1;
  string title = 2;
  string summary = 3;
  string module_id = 4;
  string repository_id = 5;
  string external_ref = 6;
}

message CreateInternalDocumentResponse {
  InternalDocument document = 1;
}

message GetInternalDocumentRequest {
  RequestContext context = 1;
  string document_id = 2;
}

message GetInternalDocumentResponse {
  InternalDocument document = 1;
}

message InternalDocument {
  string document_id = 1;
  string tenant_id = 2;
  string title = 3;
  string slug = 4;
  string summary = 5;
  string module_id = 6;
  string repository_id = 7;
  string external_ref = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// ========================
// Runbook
// ========================

message CreateRunbookRequest {
  RequestContext context = 1;
  string title = 2;
  string summary = 3;
  string module_id = 4;
  string document_id = 5;
}

message CreateRunbookResponse {
  Runbook runbook = 1;
}

message GetRunbookRequest {
  RequestContext context = 1;
  string runbook_id = 2;
}

message GetRunbookResponse {
  Runbook runbook = 1;
}

message Runbook {
  string runbook_id = 1;
  string tenant_id = 2;
  string title = 3;
  string slug = 4;
  string summary = 5;
  string module_id = 6;
  string document_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ========================
// Onboarding Path
// ========================

message CreateOnboardingPathRequest {
  RequestContext context = 1;
  string name = 2;
  string description = 3;
  string target_module_id = 4;
}

message CreateOnboardingPathResponse {
  OnboardingPath onboarding_path = 1;
}

message GetOnboardingPathRequest {
  RequestContext context = 1;
  string onboarding_path_id = 2;
}

message GetOnboardingPathResponse {
  OnboardingPath onboarding_path = 1;
  repeated OnboardingTask tasks = 2;
}

message OnboardingPath {
  string onboarding_path_id = 1;
  string tenant_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  string target_module_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ========================
// Onboarding Task
// ========================

message CreateOnboardingTaskRequest {
  RequestContext context = 1;
  string onboarding_path_id = 2;
  string title = 3;
  string description = 4;
  string document_id = 5;
  string runbook_id = 6;
  int32 sort_order = 7;
}

message CreateOnboardingTaskResponse {
  OnboardingTask onboarding_task = 1;
}

message GetOnboardingTaskRequest {
  RequestContext context = 1;
  string onboarding_task_id = 2;
}

message GetOnboardingTaskResponse {
  OnboardingTask onboarding_task = 1;
}

message OnboardingTask {
  string onboarding_task_id = 1;
  string tenant_id = 2;
  string onboarding_path_id = 3;
  string title = 4;
  string description = 5;
  string document_id = 6;
  string runbook_id = 7;
  int32 sort_order = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// ========================
// Engineer Onboarding Assignment
// ========================

message AssignEngineerToOnboardingPathRequest {
  RequestContext context = 1;
  string engineer_id = 2;
  string onboarding_path_id = 3;
}

message AssignEngineerToOnboardingPathResponse {
  EngineerOnboardingAssignment assignment = 1;
}

message EngineerOnboardingAssignment {
  string assignment_id = 1;
  string tenant_id = 2;
  string engineer_id = 3;
  string onboarding_path_id = 4;
  OnboardingAssignmentStatus status = 5;
  google.protobuf.Timestamp assigned_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}

// ========================
// Complete Onboarding Task
// ========================

message CompleteOnboardingTaskRequest {
  RequestContext context = 1;
  string assignment_id = 2;
  string onboarding_task_id = 3;
  string completion_note = 4;
}

message CompleteOnboardingTaskResponse {
  EngineerOnboardingTaskProgress task_progress = 1;
}

message EngineerOnboardingTaskProgress {
  string task_progress_id = 1;
  string tenant_id = 2;
  string assignment_id = 3;
  string onboarding_task_id = 4;
  OnboardingTaskProgressStatus status = 5;
  string completion_note = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}

// ========================
// Engineer Onboarding Progress
// ========================

message GetEngineerOnboardingProgressRequest {
  RequestContext context = 1;
  string assignment_id = 2;
}

message GetEngineerOnboardingProgressResponse {
  EngineerOnboardingProgress progress = 1;
}

message EngineerOnboardingProgress {
  string assignment_id = 1;
  string engineer_id = 2;
  string onboarding_path_id = 3;
  OnboardingAssignmentStatus assignment_status = 4;
  int32 total_tasks = 5;
  int32 completed_tasks = 6;
  double completion_percentage = 7;
  repeated OnboardingProgressTaskView tasks = 8;
}

message OnboardingProgressTaskView {
  string onboarding_task_id = 1;
  string title = 2;
  string description = 3;
  OnboardingTaskProgressStatus status = 4;
  int32 sort_order = 5;
  google.protobuf.Timestamp completed_at = 6;
}

// ========================
// Permission
// ========================

message CreatePermissionRequest {
  RequestContext context = 1;
  string name = 2;
  string description = 3;
}

message CreatePermissionResponse {
  Permission permission = 1;
}

message GetPermissionRequest {
  RequestContext context = 1;
  string permission_id = 2;
}

message GetPermissionResponse {
  Permission permission = 1;
}

message Permission {
  string permission_id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ========================
// Internal Entity Search
// ========================

message SearchInternalEntitiesRequest {
  RequestContext context = 1;
  string query = 2;
  repeated InternalGraphNodeType allowed_node_types = 3;
  string root_entity_id = 4;
  InternalGraphNodeType root_node_type = 5;
  int32 depth = 6;
  int32 limit = 7;
  bool include_fuzzy_matches = 8;
  map<string, string> filters = 9;
}

message SearchInternalEntitiesResponse {
  repeated InternalEntitySearchResult results = 1;
  bool ambiguous = 2;
  repeated string warnings = 3;
}

message InternalEntitySearchResult {
  string entity_id = 1;
  InternalGraphNodeType node_type = 2;
  string label = 3;
  string slug = 4;
  string summary = 5;
  double score = 6;
  string match_reason = 7;
  string parent_entity_id = 8;
  InternalGraphNodeType parent_node_type = 9;

  map<string, string> attributes = 10;
}
// ========================
// Graph Reads
// ========================

message ReadInternalCompanyGraphRequest {
  RequestContext context = 1;
  string root_entity_id = 2;
  InternalGraphNodeType root_node_type = 3;
  int32 depth = 4;
  int32 limit = 5;
}

message ReadInternalCompanyGraphResponse {
  InternalGraph graph = 1;
}

message ReadLearningGraphRequest {
  RequestContext context = 1;
  string root_entity_id = 2;
  InternalGraphNodeType root_node_type = 3;
  int32 depth = 4;
  int32 limit = 5;
}

message ReadLearningGraphResponse {
  InternalGraph graph = 1;
}

// ========================
// Normalized Read-Only Graph
// ========================

message InternalGraph {
  string graph_id = 1;
  InternalGraphType graph_type = 2;
  repeated InternalGraphNode nodes = 3;
  repeated InternalGraphRelationship relationships = 4;
  google.protobuf.Timestamp read_at = 5;
}

message InternalGraphNode {
  string node_id = 1;
  InternalGraphNodeType node_type = 2;
  string label = 3;
  string summary = 4;
  string entity_id = 5;
}

message InternalGraphRelationship {
  string relationship_id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  InternalGraphRelationshipType relationship_type = 4;
  string summary = 5;
}