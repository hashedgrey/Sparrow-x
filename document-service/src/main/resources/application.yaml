spring:
  application:
    name: document-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    allow-circular-references: false

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: false

  jpa:
    entity-packages-to-scan: com.sparrowx.document.data.postgres.entities
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        column_ordering_strategy: legacy
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        format_sql: false
    show-sql: false
    open-in-view: false

  grpc:
    server:
      port: ${DOCUMENT_GRPC_PORT:50054}


sparrowx:
  document:

    ingestion:
      worker:
        enabled: ${DOCUMENT_INGESTION_ENABLED:true}
        poll-interval-millis: ${DOCUMENT_INGESTION_POLL_INTERVAL:1000}
        max-jobs-per-poll: ${DOCUMENT_INGESTION_MAX_JOBS:5}

    minio:
      enabled: ${DOCUMENT_MINIO_ENABLED:true}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket-name: ${MINIO_BUCKET:sparrowx-documents}

    elasticsearch:
      enabled: ${DOCUMENT_ELASTICSEARCH_ENABLED:false}
      index-name: ${DOCUMENT_ELASTICSEARCH_INDEX:sparrowx-document-chunks}

    qdrant:
      enabled: ${DOCUMENT_QDRANT_ENABLED:false}
      url: ${QDRANT_URL:http://localhost:6333}
      collection-name: ${DOCUMENT_QDRANT_COLLECTION:sparrowx_document_chunks}
      distance: ${DOCUMENT_QDRANT_DISTANCE:Cosine}

    embedding:
      # deterministic = local/test placeholder
      # embabel       = model selected from Embabel's embedding registry
      provider: ${DOCUMENT_EMBEDDING_ADAPTER:deterministic}

      # Single vector-dimension source for SparrowX + Qdrant initialization.
      dimension: ${DOCUMENT_EMBEDDING_DIMENSION:768}
      validate-dimension: ${DOCUMENT_EMBEDDING_VALIDATE_DIMENSION:true}

    rag:
      max-chunk-size: ${DOCUMENT_RAG_MAX_CHUNK_SIZE:1200}
      overlap-size: ${DOCUMENT_RAG_OVERLAP_SIZE:200}
      embedding-batch-size: ${DOCUMENT_RAG_EMBEDDING_BATCH_SIZE:100}

    dice:
      ingestion:
        extraction-batch-size: ${DOCUMENT_DICE_EXTRACTION_BATCH_SIZE:4}
        extraction-threads: ${DOCUMENT_DICE_EXTRACTION_THREADS:4}
        projection-parallelism: ${DOCUMENT_DICE_PROJECTION_PARALLELISM:4}
        existing-propositions-to-show: ${DOCUMENT_DICE_EXISTING_PROPOSITIONS:25}
        schema-adherence: ${DOCUMENT_DICE_SCHEMA_ADHERENCE:RELAXED}