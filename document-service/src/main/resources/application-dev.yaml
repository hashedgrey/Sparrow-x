spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    prometheus:
      access: unrestricted

  metrics:
    tags:
      service: document-service

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

  opentelemetry:
    resource-attributes:
      service.name: document-service
      service.version: 1.0.0
      service.namespace: sparrowx
      deployment.environment: dev


sparrowx:
  document:
    minio:
      enabled: true
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket-name: sparrowx-documents

    elasticsearch:
      enabled: true
      url: http://localhost:9200
      index-name: sparrowx-document-chunks

    qdrant:
      enabled: true
      url: http://localhost:6333
      collection-name: sparrowx_document_chunks
      vector-dimension: 768

    embedding:
      provider: gemini
      model: gemini-embedding-001
      dimension: 768
      api-key: ${GEMINI_API_KEY}


embabel:
  models:
    # Generative model used by DICE during document ingestion only.
    default-llm: gemini-3.1-flash-lite-preview

    # Used by Embabel/DICE entity and graph infrastructure.
    # Independent of SparrowX's existing 768-dimensional
    # Qdrant embedding configuration above.
    default-embedding-model: gemini-embedding-001

  agent:
    platform:
      # Embabel structured-output/data-binding retries.
      #
      # This is the retry layer producing messages such as:
      # "Retry attempt N of 10 due to: Invalid LLM return..."
      llm-operations:
        data-binding:
          max-attempts: 1
          fixed-backoff-millis: 100

      # Google GenAI provider retries.
      # Separate from the Embabel data-binding retries above.
      models:
        googlegenai:
          api-key: ${GEMINI_API_KEY}
          max-attempts: 3

    rag:
      graph:
        uri: ${NEO4J_URI:bolt://localhost:7687}
        username: ${NEO4J_USERNAME:neo4j}
        password: ${NEO4J_PASSWORD:password}

        content-element-index: embabel_content_index
        entity-index: embabel_entity_index

        content-element-full-text-index: embabel_content_fulltext_index
        entity-full-text-index: embabel_entity_fulltext_index

        chunk-node-name: Chunk
        entity-node-name: Entity

        max-chunk-size: 1500
        overlap-size: 200

  dice:
    store:
      # Persist propositions and DICE graph state in Neo4j.
      type: graph

      # Do not age document knowledge automatically.
      decay:
        enabled: false


# Drivine datasource used by:
# - DICE durable PropositionRepository
# - Embabel NamedEntityDataRepository
# - DICE/Embabel graph projection
database:
  datasources:
    graph:
      type: NEO4J
      host: ${NEO4J_HOST:localhost}
      port: ${NEO4J_PORT:7687}
      user-name: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
      database-name: ${NEO4J_DATABASE:neo4j}